name: password-manager   # اسم مشروع جديد => volume جديد، فلا يتعارض مع قاعدة task-manager القديمة

services:
  db:
    image: postgres:16
    container_name: vaultdb
    environment:
      POSTGRES_DB: vaultdb
      POSTGRES_USER: vaultuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?انسخ .env.example إلى .env واضبط DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultuser -d vaultdb"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vaultdb
      DB_USER: vaultuser
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?انسخ .env.example إلى .env واضبط SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/api/health')"]
      interval: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8091:80"   # محلي فقط: WebCrypto يحتاج localhost أو HTTPS
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
