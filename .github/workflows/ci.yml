name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vaultdb
          POSTGRES_USER: vaultuser
          POSTGRES_PASSWORD: vaultpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultuser -d vaultdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: vaultdb
      DB_USER: vaultuser
      DB_PASSWORD: vaultpass
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend-crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run crypto tests
        run: node frontend/tests/crypto.test.js

  docker-smoke-test:
    needs: [backend-tests, frontend-crypto-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8090/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check vault endpoint and auth guard
        run: |
          curl -fs http://localhost:8090/api/vault | grep '"initialized":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/entries)" = "401"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
