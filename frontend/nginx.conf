server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # لا سكربتات ولا أنماط مضمّنة، ولا اتصال إلا بنفس الأصل
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }
}
